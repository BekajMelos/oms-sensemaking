global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
      
  - job_name: 'oms-sensemaking'
    scrape_interval: 5s
    static_configs:
      - targets: ['oms_sensemaking:8443']
    metrics_path: '/metrics'
    scrape_timeout: 5s
    scheme: https
    tls_config:
      insecure_skip_verify: true

  - job_name: 'rabbitmq'
    scrape_interval: 5s
    static_configs:
      - targets: [ 'rabbitmq:15692' ]
    metrics_path: '/metrics'