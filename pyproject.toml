[project]
name = 'oms-sensemaking'
authors = [
  { name='Black Cape, Inc.' }
]
description = 'Python module used to perform analytics on OMS data.'
license = {text = 'Copyright 2024 Black Cape, Inc. All rights reserved.'}
readme = 'README.md'
requires-python = '>=3.10'
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
    'License :: Other/Proprietary License',
    'Private :: Do Not Upload'
]
dynamic = ['version']
dependencies = [
    'alembic==1.13.2',
    'boto3==1.34.144',
    'fastapi[standard]==0.112.0',
    'fastapi-offline==1.7.2',
    'geoalchemy2==0.15.2',
    'geolib==1.0.7',
    'pandas==2.2.2',
    'psycopg[binary,pool]==3.2.1',
    'pydantic==2.8.2',
    'pydantic-settings==2.4.0',
    # 'pydantic-extra-types==2.9.0',
    'pygeohash==1.2.0',  # might want to look at pygeohash-fast
    'python-dotenv==1.0.1',
    'shapely==2.0.4',
    'sqlalchemy==2.0.32',
    'oms_sdk@git+https://tex.gerbil-cloud.ts.net:3000/data-team/omsb-2-common-utils-python.git@v1.0.0'
]

[project.optional-dependencies]
dev = [
    'coverage==7.6.0',
    'mypy==1.11.1',
    'pre-commit==3.7.1',
    'ruff==0.5.7',
    'types-shapely==2.0.0.20240714'
]
test = [
    'pytest==8.3.2',
    'pytest-cov==5.0.0',
    'pytest-asyncio==0.23.8'
]
build = ['build==1.2.1']


[project.urls]
Homepage = 'https://tex.gerbil-cloud.ts.net:3000/oms/oms-sensemaking'
Issues = 'https://tex.gerbil-cloud.ts.net:3000/issues'


[build-system]
requires = [
    'setuptools==71.1.0',
    'setuptools_scm==8.1'
]
build-backend = 'setuptools.build_meta'


[tool.setuptools_scm]
# enable setuptools_scm for dynamic version


[tool.mypy]
ignore_missing_imports = true
#follow_imports = 'skip'
plugins = 'pydantic.mypy'


[tool.pytest.ini_options]
minversion = '8.2'
addopts = '-ra -q --cov=oms_sensemaking --cov-report term --cov-report html'
testpaths = [
    'tests'
]
#log_cli = True
required_plugins = [
    'pytest-cov==5.0.0'
]


[tool.coverage.run]
branch = true
omit = [
    '**/__main__.py',
    '*/test*'
]


[tool.coverage.report]
#skip_empty = true

exclude_also = [
    # Don't complain if tests don't hit defensive assertion code:
    'raise AssertionError',
    'raise NotImplementedError',

    # Don't complain if non-runnable code isn't run:
    'if __name__ == .__main__.:',

    # Don't complain if __repr__ isn't called explicitly
    'def __repr__',

    # Don't complain about abstract methods, they aren't run:
    '@(abc\\.)?abstractmethod'
]
