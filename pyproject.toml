[project]
name = 'oms-sensemaking'
authors = [
  { name='Black Cape, Inc.' }
]
description = 'Python module used to perform analytics on ATOMS data.'
license = {text = 'Copyright 2024 Black Cape, Inc. All rights reserved.'}
readme = 'README.md'
requires-python = '>=3.12'
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
    'License :: Other/Proprietary License',
    'Private :: Do Not Upload'
]
dynamic = ['version']
dependencies = [
    'alembic==1.18.3',
    'cachetools==7.0.0',
    'collections-extended==2.0.2',
    'fastapi[standard]==0.128.2',
    'fastapi-offline==1.7.6',
    'fastkml==1.4.0',
    'filterpy~=1.4.5',
    'geoalchemy2==0.18.1',
    'pygeohash==3.2.2',
    'geopy==2.4.1',
    'graphql-core==3.2.7',
    'hishel==0.1.2',
    'numpy==2.4.2',
    'opentelemetry-api==1.39.1',
    'opentelemetry-sdk==1.39.1',
    'opentelemetry-exporter-otlp-proto-http==1.39.1',
    'opentelemetry-exporter-otlp-proto-grpc==1.39.1',
    'opentelemetry-instrumentation-fastapi==0.60b1',
    'opentelemetry-instrumentation-logging==0.60b1',
    'prometheus-client==0.24.1',
    'oms_sdk==15.0.0',
    'pandas==3.0.0',
    'pika==1.3.2',
    'psycopg[binary,pool]==3.3.2',
    'psycopg2-binary (>=2.9.10,<3.0.0)',
    'pydantic==2.12.5',
    'pydantic-settings==2.12.0',
    'python-dotenv~=1.1.1',
    'pyyaml~=6.0.1',
    'ratelimit==2.2.1',
    'rdflib~=7.5.0',
    'shapely==2.1.2',
    'sqlalchemy==2.0.46',
    'urllib3==2.6.3',
    'xmltodict==1.0.2'
]

[project.optional-dependencies]
dev = [
    'debugpy==1.8.20',
    'mypy==1.19.1',
    'pre-commit==4.5.1',
    'ruff==0.15.0',
    'types-cachetools==6.2.0.20251022',
    'types-python-dateutil==2.9.0.20260124',
    'types-shapely==2.1.0.20250917'
]

docs = [
    'mkdocs==1.6.1',
    'mkdocs-material==9.7.1',
    'mkdocstrings[python]==1.0.2',
    'mkdocs-gen-files==0.6.0',
    'mkdocs-literate-nav==0.6.2',
    'mkdocs-section-index==0.3.10'
]

test = [
    'coverage==7.13.3',
    'pytest==9.0.2',
    'pytest-asyncio==1.3.0',
    'pytest-cov==7.0.0',
    'pytest-mock==3.15.1'
]

build = [  # dependnecies for building the project wheel and docker image
    'build==1.4.0',
    'setuptools_scm==9.2.2'
]

[build-system]
requires = [
    'setuptools==71.1.0',
    'setuptools_scm==8.1'
]
build-backend = 'setuptools.build_meta'


[tool.setuptools_scm]
# enable setuptools_scm for dynamic version


[tool.mypy]
ignore_missing_imports = true
#follow_imports = 'skip'
plugins = 'pydantic.mypy'


[tool.pytest.ini_options]
asyncio_mode = 'auto'
minversion = '8.2'
addopts = '-ra -q --cov=oms_sensemaking --cov-report term --cov-report html'
testpaths = [
    'tests',
    'tests_int'
]
filterwarnings = [
    # Alembic Postgres autoincrement noise
    "ignore:autoincrement and existing_autoincrement only make sense for MySQL:UserWarning:alembic",
]
#log_cli = True
required_plugins = [
    'pytest-cov==7.0.0'
]


[tool.coverage.run]
branch = true
omit = [
    '**/__main__.py',
    '*/test*'
]
relative_files = true


[tool.coverage.report]
#skip_empty = true

exclude_also = [
    # Don't complain if tests don't hit defensive assertion code:
    'raise AssertionError',
    'raise NotImplementedError',

    # Don't complain if non-runnable code isn't run:
    'if __name__ == .__main__.:',

    # Don't complain if __repr__ isn't called explicitly
    'def __repr__',

    # Don't complain about abstract methods, they aren't run:
    '@(abc\\.)?abstractmethod'
]
