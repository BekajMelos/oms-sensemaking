[project]
name = 'oms-sensemaking'
authors = [
  { name='Black Cape, Inc.' }
]
description = 'Python module used to perform analytics on OMS data.'
license = {text = 'Copyright 2024 Black Cape, Inc. All rights reserved.'}
readme = 'README.md'
requires-python = '>=3.12'
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
    'License :: Other/Proprietary License',
    'Private :: Do Not Upload'
]
dynamic = ['version']
dependencies = [
    'alembic==1.13.2',
    'collections-extended==2.0.2',
    'fastapi[standard]==0.112.2',
    'fastapi-offline==1.7.2',
    'fastkml==1.1.0',
    'geoalchemy2==0.15.2',
    'geolib==1.0.7',
    'geopy==2.4.1',
    'hishel==0.1.2',
    'numpy==1.26.4',
    'oms_sdk==6.0.0',
    'pandas==2.2.2',
    'pika==1.3.2',
    'psycopg[binary,pool]==3.2.1',
    'pydantic==2.8.2',
    'pydantic-settings==2.4.0',
    'python-dotenv==1.0.1',
    'pyyaml~=6.0.1',
    'ratelimit==2.2.1',
    'rdflib~=7.0.0',
    'shapely==2.0.6',
    'sqlalchemy==2.0.32',
    'xmltodict==0.13.0'
]

[project.optional-dependencies]
dev = [
    'debugpy==1.8.9',
    'mypy==1.11.1',
    'pre-commit==3.7.1',
    'ruff==0.8.1',
    'types-python-dateutil==2.9.0.20240316',
    'types-shapely==2.0.0.20240714'
]

docs = [
    'mkdocs==1.6.1',
    'mkdocs-material==9.5.35',
    'mkdocstrings[python]==0.26.1',
    'mkdocs-gen-files==0.5.0',
    'mkdocs-literate-nav==0.6.1',
    'mkdocs-section-index==0.3.9'
]

test = [
    'coverage==7.6.0',
    'pytest==8.3.2',
    'pytest-asyncio==0.23.8',
    'pytest-cov==5.0.0',
    'pytest-mock==3.14.0'
]

build = [  # dependnecies for building the project wheel and docker image
    'build==1.2.1',
    'setuptools_scm==8.1'
]

[build-system]
requires = [
    'setuptools==71.1.0',
    'setuptools_scm==8.1'
]
build-backend = 'setuptools.build_meta'


[tool.setuptools_scm]
# enable setuptools_scm for dynamic version


[tool.mypy]
ignore_missing_imports = true
#follow_imports = 'skip'
plugins = 'pydantic.mypy'


[tool.pytest.ini_options]
minversion = '8.2'
addopts = '-ra -q --cov=oms_sensemaking --cov-report term --cov-report html'
testpaths = [
    'tests',
    'tests_int'
]
#log_cli = True
required_plugins = [
    'pytest-cov==5.0.0'
]


[tool.coverage.run]
branch = true
omit = [
    '**/__main__.py',
    '*/test*'
]


[tool.coverage.report]
#skip_empty = true

exclude_also = [
    # Don't complain if tests don't hit defensive assertion code:
    'raise AssertionError',
    'raise NotImplementedError',

    # Don't complain if non-runnable code isn't run:
    'if __name__ == .__main__.:',

    # Don't complain if __repr__ isn't called explicitly
    'def __repr__',

    # Don't complain about abstract methods, they aren't run:
    '@(abc\\.)?abstractmethod'
]
