[project]
name = 'oms-sensemaking'
authors = [
  { name='Black Cape, Inc.' }
]
description = 'Python module used to perform analytics on OMS data.'
license = {text = 'Copyright 2024 Black Cape, Inc. All rights reserved.'}
readme = 'README.md'
requires-python = '>=3.10'
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
    'License :: Other/Proprietary License',
    'Private :: Do Not Upload'
]
dependencies = [
    'pygeohash==1.2.0',
    'python-dotenv==1.0.1',
    'shapely==2.0.4'
]
dynamic = ['version']


[project.urls]
Homepage = 'https://tex.gerbil-cloud.ts.net:3000/oms/oms-sensemaking'
Issues = 'https://tex.gerbil-cloud.ts.net:3000/issues'


[build-system]
requires = [
    'setuptools >= 70.3',
    'setuptools_scm >= 8.1'
]
build-backend = 'setuptools.build_meta'


[tool.coverage.run]
branch = true
omit = [
    '**/__main__.py',
    '*/test*'
]

[tool.setuptools_scm]
# enable setuptools_scm for dynamic version
