name: Test OMS Sensemaking
run-name: ${{ gitea.actor }} is testing oms_sensemaking

on: push

env:
  # workflow config
  PIP_NO_CACHE_DIR: 1
  PIP_PROGRESS_BAR: off

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Configure Private PyPI
        run: |
          cat > ~/.netrc <<EOF
          machine ${{ vars.GIT_HOST }}
          login ${{ gitea.repository_owner }}
          password ${{ secrets.pypi_token }}

          EOF
          chmod 600 ~/.netrc
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        env:
          PIP_INDEX_URL: ${{ vars.PIP_INDEX }}
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip wheel
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: |
          source .venv/bin/activate
          ruff check --output-format=github
        continue-on-error: false
      - name: Lint with mypy
        run: |
          source .venv/bin/activate
          mypy src
        continue-on-error: false

  test:
    runs-on: ubuntu-latest
    env:
      USER_DN: "cn=test10,ou=jade,ou=meme,o=bia,st=maryland,c=us"
      CERT_PATH: ./etc/pki/test10.pem
      KEY_PATH: ./etc/pki/test10.key
      OMSB_URL: ${{ vars.OMSB_GRAPHQL_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4
      - name: Configure Private PyPI
        run: |
          cat > ~/.netrc <<EOF
          machine ${{ vars.GIT_HOST }}
          login ${{ gitea.repository_owner }}
          password ${{ secrets.pypi_token }}

          EOF
          chmod 600 ~/.netrc
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        env:
          PIP_INDEX_URL: ${{ vars.PIP_INDEX }}
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
        run: |
          sudo apt-get update
          sudo apt-get install -y bsdmainutils
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip wheel
          pip install -e ".[dev,test]"
      - name: Decrypt SSL Key
        run: |
          bin/transcrypt -p ${{ secrets.TRANSCRYPT_PW }} -c aes-256-cbc -y
      - name: Prepare .env file
        run: |
          cp .env.template .env
      - name: Test with pytest
        run: |
          source .venv/bin/activate
          pytest tests --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html --cov-fail-under=80
        continue-on-error: false
