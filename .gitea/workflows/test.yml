name: Test OMS Sensemaking
run-name: ${{ gitea.actor }} is testing oms_sensemaking

on: push

env:
  # workflow config
  PIP_NO_CACHE_DIR: 1
  PIP_PROGRESS_BAR: off

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Configure Private PyPI
        run: |
          cat > ~/.netrc <<EOF
          machine tex.gerbil-cloud.ts.net
          login ${{ gitea.repository_owner }}
          password ${{ secrets.pypi_token }}

          EOF
          chmod 600 ~/.netrc
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        env:
          PIP_INDEX_URL: https://tex.gerbil-cloud.ts.net:3000/api/packages/oms/pypi/simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip wheel
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: |
          source .venv/bin/activate
          ruff check --output-format=github
        continue-on-error: false
      - name: Lint with mypy
        run: |
          source .venv/bin/activate
          mypy src
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    env:
      USER_DN: "cn=test10,ou=jade,ou=meme,o=bia,st=maryland,c=us"
      CERT_PATH: ./pki/test10.pem
      KEY_PATH: ./pki/test10.key
      OMSB_URL: https://tex.gerbil-cloud.ts.net:30000/services/oms-bridge/2.0/graphql

    steps:
      - uses: actions/checkout@v4
      - name: Configure Private PyPI
        run: |
          cat > ~/.netrc <<EOF
          machine tex.gerbil-cloud.ts.net
          login ${{ gitea.repository_owner }}
          password ${{ secrets.pypi_token }}

          EOF
          chmod 600 ~/.netrc
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        env:
          PIP_INDEX_URL: https://tex.gerbil-cloud.ts.net:3000/api/packages/oms/pypi/simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip wheel
          pip install -e ".[dev,test]"
      - name: Test with pytest
        run: |
          source .venv/bin/activate
          pytest tests --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html
        continue-on-error: true
