name: Build OMS Sensemaking
run-name: ${{ gitea.actor }} is building oms_sensemaking

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - "main"
    pull_request:
      branches:
        - "main"

env:
  # workflow config
  PIP_NO_CACHE_DIR: 1
  PIP_PROGRESS_BAR: off
  DOCKER_REGISTRY: tex.gerbil-cloud.ts.net:5000

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Private PyPI
        run: |
          cat > ~/.netrc <<EOF
          machine tex.gerbil-cloud.ts.net
          login ${{ gitea.repository_owner }}
          password ${{ secrets.pypi_token }}
          
          EOF
          chmod 600 ~/.netrc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        env:
          PIP_INDEX_URL: https://tex.gerbil-cloud.ts.net:3000/api/packages/oms/pypi/simple
          PIP_EXTRA_INDEX_URL: https://pypi.org/simple
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip wheel
          pip install -e ".[build]"
          echo ~/.netrc

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Retrieve version
        id: version
        run: |
          echo "APP_VERSION=$(source .venv/bin/activate && python -m setuptools_scm)" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aio4/dev/services/oms/oms-sensemaking

      # Login against a Docker registry except on PR
      - name: Log into registry ${{ env.DOCKER_REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ gitea.repository_owner }}
          password: ${{ secrets.pypi_token }}

      # Build and push Docker image with Buildx (don't push on PR)
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}

          # https://github.com/docker/build-push-action/issues/293#issuecomment-1865957342
          secret-files: |
             mynetrc=~/.netrc

          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
