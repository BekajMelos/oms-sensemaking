services:
  oms_sensemaking:
    build:
      context: .
      secrets:
        - mynetrc
    volumes:
      - .:/app
    ports:
      - 5001:80
    environment:
      DB_HOST: postgis
      DB_USER: ${DB_USER:-${PGUSER:-appuser}}
      DB_PASSWORD: ${DB_PASSWORD:-${PGPASSWORD}}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      RELOAD_APP: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  postgis:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64  # see https://github.com/postgis/docker-postgis/issues/216
    ports:
      - 5433:5432
    environment:
      # PostgreSQL/PostGIS variables
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD:

      # psql variables
      PGUSER: ${PGUSER:-${POSTGRES_USER:-postgres}}
      PGPASSWORD: ${PGPASSWORD:-$POSTGRES_PASSWORD}
      PGDATABASE: ${PGDATABASE:-oms_sensemaking}
    volumes:
      - postgis:/var/lib/postgresql/data
      - ./docker/postgis/initdb.d/20_oms-sensemaking.sql:/docker-entrypoint-initdb.d/20_oms-sensemaking.sql

  pgadmin:
    profiles:
      - dev
    image: dpage/pgadmin4:8
    volumes:
      - ./docker/postgis/servers.json:/pgadmin4/servers.json
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dev@blackcape.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-$POSTGRES_PASSWORD}
      PGADMIN_CONFIG_LOGIN_BANNER: "${PGADMIN_CONFIG_LOGIN_BANNER:-'<h4>Development Database</h4>'}"
    ports:
      - 5050:80
    depends_on:
      - postgis

  graphql:
    image: tex.gerbil-cloud.ts.net:5000/ado/services/oms-bridge/oms-bridge:${OMSB_VERSION}-latest
    container_name: graphql
    env_file:
      - .env
    environment:
      - OMSB_SERVICE=api
      - OMSB_CORS_ALLOWED_ORIGIN=https://localhost
      - OMSB_ENABLE_LIQUIBASE=true
    volumes:
      - ./etc/pki:/opt/oms-bridge/pki
      - ./etc/whitelist.txt:/opt/oms-bridge/etc/whitelist.txt
      - ./etc/collectionstatus/LocalCollectionStatusThresholds.yaml:/opt/oms-bridge/etc/collectionstatus/CollectionStatusThresholds.yaml
    ports:
      - "8010:8000"
      - "8020:8443"
    depends_on:
      - oms_postgres
      - localstack
    profiles:
      - local

  localstack:
    container_name: localstack
    image: localstack/localstack:3.4.0
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      - DEBUG=${DEBUG-}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./docker/localstack:/etc/localstack/init/ready.d"

  zk:
    container_name: zk
    hostname: zk
    image: zookeeper:3.4.9
    restart: always
    ports:
      - "2181:2181"
    profiles:
      - local

  aac2:
    hostname: aac2
    container_name: aac2
    image: tex.gerbil-cloud.ts.net:5000/dpaas-internal/aac/ent-aac-service:2.1.15.3
    command: sh -c "./entrypoint.sh"
    volumes:
      - ./etc/pki:/opt/common/pki
      - ./docker/aac2/entrypoint.sh:/app/entrypoint.sh
      - ./docker/aac2/users:/app/users
    ports:
      - "5022:3000"
    environment:
      HOST_URL: 0.0.0.0:3000
      DEVELOPMENT_MODE: "true"
      ENABLE_L1_CACHE_SYNC: "false"
      HOST_TLS_CERT_FILE: /opt/common/pki/server.public
      HOST_TLS_KEY_FILE: /opt/common/pki/server.private
      TEMPLATES_PARSE_INTERVAL: 15s
    profiles:
      - local

  ess2:
    container_name: ess2
    hostname: ess2
    image: tex.gerbil-cloud.ts.net:5000/ado/services/elasticsearch-security-service:2.1.9-36
    volumes:
      - ./etc/pki:/opt/common/pki
    env_file:
      - docker/meme/docker.env
    environment:
      JAVA_TOOL_OPTIONS: -XX:+UseSerialGC
      LOG_LEVEL: all
      DEBUG: "false"
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_TEST_USER_DN: CN=jade.meme.bia-boeing.com | CN=twl-server-generic2, OU=DAE, OU=DIA, OU=twl-server-generic2, O=U.S. Government, C=US
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_TEST_SSL_CLIENT_S_DN: CN=jade.meme.bia-boeing.com | CN=twl-server-generic2, OU=DAE, OU=DIA, OU=twl-server-generic2, O=U.S. Government, C=US
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_AUDIT_AUDITEDACTIONS: "DO_NOT_AUDIT_ACTION"
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_DISCOVERY_ES_PROTOCOL: http
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_AAC_PORT: 3000
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_AAC_HOST: aac2
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_AAC_PROTOCOL: http
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_AAC_PATH: /
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_ELASTICSEARCH_SNIPPETTYPE: elasticsearch5
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_HTTP_CLIENT_MAXRESPONSESIZE: 10
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_SERVER_MAXREQUESTSIZE: 15
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_SERVER_ENABLELEGACYADMINCONTROLS: false
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_DISCOVERY_ES_ESHOSTS: elasticsearch7:9200
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_DISCOVERY_ES_ENDPOINT: /
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_DISCOVERY_ES_CHECKCERTIFICATE: false
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_SERVER_ZK_ZOOKEEPERCONNECTION: zk:2181
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_SERVER_ZK_ANNOUNCEMENTPOINT: /services/ess/2.1
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_SERVER_HTTPPORT: :8000
      GOV_IC_CTE_ELASTICSEARCH_CONFIG_SERVER_HTTPSPORT: :8889
    ports:
      - "8888:8000" #HTTP
      - "7399:8889" #HTTPS
      - "4000:4000"
      - "10000:9990"
    depends_on:
      - zk
      - aac2
      - elasticsearch7
    profiles:
      - local

  elasticsearch7:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
    container_name: elasticsearch7
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    ports:
      - 9200:9200
      - 9300:9300
    restart: always
    profiles:
      - local

  es7_config:
    image: tex.gerbil-cloud.ts.net:5000/ado/services/elasticsearch-security-service:2.1.9-36
    container_name: es7_config
    volumes:
      - ./etc/es/v7/omsb-node-document-index.json:/omsb-node-document-index.json
    links:
      - elasticsearch7
    depends_on:
      - elasticsearch7
    command: >
      bash -c '
        until curl -sS "http://elasticsearch7:9200/_cat/health?h=status" | grep -q "green\|yellow"; do
          sleep 1
        done
        curl -X PUT "http://elasticsearch7:9200/omsb_node_index" -H "Content-Type: application/json" -d @/omsb-node-document-index.json
      '
    profiles:
      - local

volumes:
  postgis:
  pgadmin:

secrets:
  mynetrc:
    file: ${HOME}/.netrc
